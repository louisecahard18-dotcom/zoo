<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Diffusion caméra</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="page" id="setup">
    <h1>Diffusion depuis l'iPad</h1>
    <p class="sub">Installez l'iPad face à l'enclos, branché sur secteur, puis lancez la diffusion.</p>
    <form class="card form" id="form">
      <label>Enclos filmé
        <select id="enclosure" required></select>
      </label>
      <label>Code soigneur
        <input id="code" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Démarrer la caméra</button>
      <div class="error" id="err"></div>
    </form>
  </main>

  <div class="monitor hidden" id="monitor">
    <video id="video" autoplay playsinline muted></video>
    <canvas class="noise" id="noise"></canvas>
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="corner a"></div><div class="corner b"></div><div class="corner c"></div><div class="corner d"></div>
    <div class="osd">
      <div class="tl"><span class="rec">REC</span> <span id="viewers"></span></div>
      <div class="tr" id="clock"></div>
      <div class="bl"><div id="camId"></div><div id="camName"></div></div>
      <div class="br" id="net"></div>
    </div>
    <div class="toolbar" id="toolbar">
      <button class="secondary" id="flip">Changer de caméra</button>
      <button class="secondary" id="dim">Écran noir</button>
      <button class="secondary" id="stop">Arrêter</button>
    </div>
  </div>
  <!-- Écran noir : économise la batterie / reste discret, la diffusion continue. Toucher pour revenir. -->
  <div id="blackout" class="hidden" style="position:fixed;inset:0;background:#000;z-index:10"></div>

  <script src="/common.js"></script>
  <script>
    (async () => {
      const cfg = await Zoo.config();
      const $ = (id) => document.getElementById(id);
      const sel = $('enclosure');
      for (const e of cfg.enclosures) sel.add(new Option(`${e.cam} — ${e.name}`, e.id));
      sel.value = Zoo.store.get('cameraEnclosure') || cfg.enclosures[0].id;
      $('code').value = Zoo.store.get('cameraCode') || '';

      if (!window.isSecureContext || !navigator.mediaDevices) {
        $('err').textContent = 'La caméra exige une connexion HTTPS. Ouvrez cette page via l’adresse https:// du serveur.';
      }

      let stream, facing = 'environment', signal, started = false;
      const peers = new Map(); // viewerId -> RTCPeerConnection

      const getStream = () => navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 24, max: 30 } },
      });

      const updateViewers = () => {
        $('viewers').textContent = peers.size ? `· ${peers.size} parrain${peers.size > 1 ? 's' : ''}` : '';
      };

      const dropPeer = (vid) => { peers.get(vid)?.close(); peers.delete(vid); updateViewers(); };

      async function call(vid, send) {
        dropPeer(vid);
        const pc = new RTCPeerConnection({ iceServers: cfg.iceServers });
        peers.set(vid, pc);
        updateViewers();
        stream.getTracks().forEach((t) => pc.addTrack(t, stream));
        // Limite le débit par parrain : l'iPad envoie un flux par spectateur.
        for (const s of pc.getSenders()) {
          const p = s.getParameters();
          p.encodings = [{ ...(p.encodings?.[0] || {}), maxBitrate: 900_000 }];
          s.setParameters(p).catch(() => {});
        }
        pc.onicecandidate = (e) => e.candidate && send({ type: 'ice', to: vid, data: e.candidate });
        pc.onconnectionstatechange = () => {
          if (['failed', 'closed'].includes(pc.connectionState) && peers.get(vid) === pc) dropPeer(vid);
        };
        await pc.setLocalDescription(await pc.createOffer());
        send({ type: 'offer', to: vid, data: pc.localDescription });
      }

      $('form').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        $('err').textContent = '';
        const enc = cfg.enclosures.find((e) => e.id === sel.value);
        const code = $('code').value.trim();
        try {
          stream = await getStream();
        } catch (e) {
          $('err').textContent = 'Accès à la caméra refusé. Autorisez-le dans Réglages › Safari › Caméra.';
          return;
        }
        Zoo.store.set('cameraEnclosure', enc.id);
        Zoo.store.set('cameraCode', code);

        $('video').srcObject = stream;
        $('camId').textContent = enc.cam;
        $('camName').textContent = enc.name;
        $('setup').classList.add('hidden');
        $('monitor').classList.remove('hidden');
        if (!started) {
          started = true;
          Zoo.clock($('clock'));
          Zoo.noise($('noise'));
          Zoo.autoHide($('toolbar'));
          Zoo.keepAwake();
        }

        signal = Zoo.signal({ role: 'camera', enclosure: enc.id, code }, {
          onOpen() { $('net').textContent = 'EN LIGNE'; },
          onClose() { $('net').textContent = 'RECONNEXION…'; [...peers.keys()].forEach(dropPeer); },
          onFatal(message) {
            stopAll();
            $('err').textContent = message;
          },
          async onMessage(msg, send) {
            if (msg.type === 'joined') msg.viewers.forEach((v) => call(v, send));
            if (msg.type === 'viewer-joined') call(msg.id, send);
            if (msg.type === 'viewer-left') dropPeer(msg.id);
            const pc = peers.get(msg.from);
            if (msg.type === 'answer' && pc) { await pc.setRemoteDescription(msg.data); await Zoo.flushIce(pc); }
            if (msg.type === 'ice' && pc) Zoo.addIce(pc, msg.data);
          },
        });
      });

      // (Re)démarre la caméra et remplace la piste vidéo chez tous les parrains connectés.
      async function restartCamera() {
        stream?.getTracks().forEach((t) => t.stop());
        stream = await getStream();
        $('video').srcObject = stream;
        const track = stream.getVideoTracks()[0];
        for (const pc of peers.values()) {
          pc.getSenders().find((s) => !s.track || s.track.kind === 'video')?.replaceTrack(track);
        }
      }

      $('flip').onclick = () => {
        facing = facing === 'environment' ? 'user' : 'environment';
        restartCamera().catch(() => {});
      };

      $('dim').onclick = () => $('blackout').classList.remove('hidden');
      $('blackout').onclick = () => $('blackout').classList.add('hidden');

      function stopAll() {
        signal?.stop();
        signal = null;
        [...peers.keys()].forEach(dropPeer);
        stream?.getTracks().forEach((t) => t.stop());
        $('monitor').classList.add('hidden');
        $('setup').classList.remove('hidden');
      }
      $('stop').onclick = stopAll;

      // Safari coupe la caméra quand l'iPad passe en arrière-plan : on la relance au retour.
      document.addEventListener('visibilitychange', () => {
        const track = stream?.getVideoTracks()[0];
        if (document.visibilityState === 'visible' && signal && track?.readyState === 'ended') {
          restartCamera().catch(() => {});
        }
      });
    })();
  </script>
</body>
</html>
