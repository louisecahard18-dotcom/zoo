<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Caméra d'enclos</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="monitor offline" id="monitor">
    <video id="video" autoplay playsinline muted></video>
    <canvas class="noise" id="noise"></canvas>
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="corner a"></div><div class="corner b"></div><div class="corner c"></div><div class="corner d"></div>
    <div class="osd">
      <div class="tl"><span class="rec" id="rec">REC</span></div>
      <div class="tr" id="clock"></div>
      <div class="bl"><div id="camId"></div><div id="camName"></div></div>
      <div class="br" id="zoo"></div>
      <div class="center" id="status"><span>Connexion…</span></div>
    </div>
    <div class="toolbar" id="toolbar">
      <button class="secondary" onclick="location.href='/'">← Caméras</button>
      <button class="secondary" id="fs">Plein écran</button>
    </div>
  </div>

  <script src="/common.js"></script>
  <script>
    (async () => {
      const code = Zoo.store.get('sponsorCode');
      if (!code) return location.replace('/');

      const cfg = await Zoo.config();
      const id = new URLSearchParams(location.search).get('e');
      const enc = cfg.enclosures.find((e) => e.id === id);
      if (!enc) return location.replace('/');

      document.title = `${enc.cam} — ${enc.name}`;
      document.getElementById('camId').textContent = enc.cam;
      document.getElementById('camName').textContent = enc.name;
      document.getElementById('zoo').textContent = cfg.zooName;
      Zoo.clock(document.getElementById('clock'));
      Zoo.noise(document.getElementById('noise'));
      Zoo.autoHide(document.getElementById('toolbar'));

      const monitor = document.getElementById('monitor');
      const video = document.getElementById('video');
      const status = document.getElementById('status');
      const rec = document.getElementById('rec');
      const setStatus = (text) => {
        status.classList.toggle('hidden', !text);
        if (text) status.firstElementChild.textContent = text;
        monitor.classList.toggle('offline', !!text);
        rec.classList.toggle('hidden', !!text);
      };

      document.getElementById('fs').onclick = () => {
        const el = document.documentElement;
        (document.fullscreenElement ? document.exitFullscreen() : (el.requestFullscreen || el.webkitRequestFullscreen).call(el))?.catch?.(() => {});
      };

      let pc = null;
      const closePc = () => { if (pc) { pc.close(); pc = null; } video.srcObject = null; };

      Zoo.signal({ role: 'viewer', enclosure: id, code }, {
        onFatal(message) {
          setStatus(message);
          if (/code/i.test(message)) { Zoo.store.del('sponsorCode'); setTimeout(() => location.replace('/'), 2500); }
        },
        onClose() { closePc(); setStatus('Signal perdu — reconnexion…'); },
        async onMessage(msg, send) {
          if (msg.type === 'joined') setStatus(msg.live ? 'Connexion…' : 'Signal perdu — caméra hors ligne');
          if (msg.type === 'camera-offline') { closePc(); setStatus('Signal perdu — caméra hors ligne'); }

          if (msg.type === 'offer') {
            closePc();
            pc = new RTCPeerConnection({ iceServers: cfg.iceServers });
            pc.onicecandidate = (e) => e.candidate && send({ type: 'ice', data: e.candidate });
            pc.ontrack = (e) => { video.srcObject = e.streams[0]; video.play().catch(() => {}); };
            pc.onconnectionstatechange = () => {
              if (!pc) return;
              if (pc.connectionState === 'connected') setStatus('');
              if (pc.connectionState === 'failed') setStatus('Signal perdu — réseau bloqué');
            };
            await pc.setRemoteDescription(msg.data);
            await Zoo.flushIce(pc);
            await pc.setLocalDescription(await pc.createAnswer());
            send({ type: 'answer', data: pc.localDescription });
          }
          if (msg.type === 'ice' && pc) Zoo.addIce(pc, msg.data);
        },
      });
    })();
  </script>
</body>
</html>
